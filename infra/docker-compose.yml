# One host, one compose. Each service = one container with its own Dockerfile.
# Run from repo root:  docker compose -f infra/docker-compose.yml --env-file .env up -d --build
services:
  backend:
    build: ../backend
    env_file: ../.env
    restart: unless-stopped
    expose: ["8000"]
    # No healthcheck here on purpose: slim and alpine base images often ship neither
    # wget nor curl, so a generic check silently fails and blocks everything that
    # depends on it. Add one written for YOUR image, e.g. for python:*-slim:
    #   healthcheck:
    #     test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    #     interval: 10s
    #     timeout: 3s
    #     retries: 6
  frontend:
    build: ../frontend
    restart: unless-stopped
    expose: ["3000"]
    depends_on: [backend]
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: ../.env            # DOMAIN
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend, frontend]
volumes:
  caddy_data: {}
  caddy_config: {}
