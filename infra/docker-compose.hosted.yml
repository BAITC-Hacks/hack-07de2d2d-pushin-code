# Variant for a host that ALREADY runs Caddy (or any other web server) on 80/443.
# The deploy host 89.126.192.65 is one: it serves the production S-Munai site and CRM
# through a system Caddy. Taking ports 80/443 there would either fail to start or, worse,
# take production down — so this compose publishes to loopback only and lets the existing
# Caddy reverse-proxy to it (see caddy-site.snippet).
#
# Run from repo root:  docker compose -f infra/docker-compose.hosted.yml --env-file .env up -d --build
services:
  backend:
    build: ../backend
    env_file: ../.env
    restart: unless-stopped
    ports: ["127.0.0.1:8100:8000"]
    # No healthcheck here on purpose: slim and alpine base images often ship neither
    # wget nor curl, so a generic check silently fails and blocks everything that
    # depends on it. Add one written for YOUR image, e.g. for python:*-slim:
    #   healthcheck:
    #     test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    #     interval: 10s
    #     timeout: 3s
    #     retries: 6
  frontend:
    build: ../frontend
    restart: unless-stopped
    ports: ["127.0.0.1:3100:3000"]
    depends_on: [backend]
