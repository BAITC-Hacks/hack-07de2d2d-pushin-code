[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "wind-forecast"
version = "0.1.0"
description = "CSV-only turbine history forecasting with chronological multi-horizon evaluation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "catboost>=1.2,<2",
  "requests>=2.32,<3",
  "pyarrow>=17,<24",
]

[project.optional-dependencies]
weather = ["eccodes>=2.40,<3", "eccodeslib>=2.40,<3"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1.2,<2"]

[project.scripts]
wind-forecast = "wind_forecast.offline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wind_forecast"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/configs", "/README.md", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
