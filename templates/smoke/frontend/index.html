<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pushin' Code — HackAlem AI</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font:16px/1.6 ui-sans-serif,system-ui,sans-serif; background:#0d1117; color:#e6edf3; }
  main { text-align:center; padding:24px; }
  h1 { font-size:clamp(24px,5vw,40px); margin:0 0 8px; letter-spacing:-0.02em; }
  p { color:#8b949e; margin:4px 0; }
  code { background:#161b22; padding:2px 6px; border-radius:4px; }
  #api { margin-top:20px; font-family:ui-monospace,monospace; font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Pushin' Code</h1>
  <p>HackAlem AI · 23 сентября 2026</p>
  <p>Дымовая заглушка. Деплой, TLS и проксирование работают.</p>
  <div id="api">проверяю <code>/health</code>…</div>
</main>
<script>
  fetch('/health').then(r => r.json())
    .then(d => document.getElementById('api').textContent = '/health → ' + JSON.stringify(d))
    .catch(e => document.getElementById('api').textContent = '/health → ошибка: ' + e);
</script>
</body>
</html>
